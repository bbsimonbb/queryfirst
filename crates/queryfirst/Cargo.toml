[package]
name = "queryfirst"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qf"
path = "src/main.rs"

[features]
db-tests = ["qf-pg/db-tests"]

[dependencies]
qf-sqlfile.workspace = true
qf-meta.workspace = true
qf-pg.workspace = true
qf-gen-ts.workspace = true
clap.workspace = true
globset = { version = "0.4", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7.18"
