[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Simon Boddy"]

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pg_query = "18.1.0"
assert_cmd = "2.2.2"
predicates = "3"
qf-sqlfile = { path = "crates/qf-sqlfile" }
qf-meta = { path = "crates/qf-meta" }
qf-pg = { path = "crates/qf-pg" }
qf-gen-ts = { path = "crates/qf-gen-ts" }
